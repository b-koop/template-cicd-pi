name: Hello world template check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the agent CLI without credentials
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent

      - name: Verify the agent CLI setup
        run: pi --version

      - name: Validate the example invocation
        run: deno task hello:dry-run

  live-hello-world:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the agent CLI
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent

      - name: Run the hello-world workflow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PI_MODEL: ${{ vars.PI_MODEL || 'anthropic/claude-sonnet-4-5' }}
        run: deno task hello
